name: Weekly Model Retraining

on:
  schedule:
    # cron ของ GitHub ใช้เวลา UTC เสมอ
    # 20:00 UTC วันอาทิตย์ = 03:00 เช้าวันจันทร์ตามเวลาไทย (ตลาดปิด ข้อมูลสัปดาห์ที่แล้วครบ)
    - cron: "0 20 * * 0"
  # เปิดให้กดรันเองจากหน้าเว็บ GitHub ได้ ไม่ต้องรอถึงวันอาทิตย์ตอนทดสอบ
  workflow_dispatch:

permissions:
  # ต้องมีสิทธิ์เขียน เพราะ workflow นี้ commit ไฟล์โมเดลกลับเข้า repo
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    # เผื่อเทรนค้าง จะได้ไม่กินโควตา Actions ทั้งเดือน
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install training dependencies
        run: pip install -r training/requirements-train.txt

      # เทรนอยู่ใน training/ แต่เซฟโมเดลไปที่ backend/model/ ซึ่งเป็นที่ที่ API อ่าน
      - name: Train models
        run: python training/train.py --out backend/model

      # ด่านกันของเสีย — ถ้าโมเดลใหม่แย่กว่าเกณฑ์ step นี้จะ exit 1
      # workflow จะหยุดตรงนี้ ไม่ commit ทับของเดิม เว็บที่ deploy อยู่จึงปลอดภัย
      - name: Validate models before deploy
        run: python training/validate_model.py --model-dir backend/model

      - name: Commit updated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/model
          if git diff --staged --quiet; then
            echo "No model changes, skipping commit"
          else
            git commit -m "retrain: update models $(date -u +%Y-%m-%d)"
            git push
          fi

      # เก็บไฟล์โมเดลไว้ดูย้อนหลัง 90 วัน เผื่อต้องเทียบว่าเวอร์ชันไหนดีกว่า
      - name: Upload models as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_number }}
          path: backend/model/
          retention-days: 90
